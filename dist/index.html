<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#c0c0c0" />
    <meta
      name="description"
      content="A working Windows 3.1 desktop in your browser. Program Manager, File Manager, Paintbrush, Write, Solitaire, Minesweeper, and a persistent virtual drive."
    />
    <title>Windows 3.1</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23000' d='M2 3h28v26H2z'/%3E%3Cpath fill='%23c0c0c0' d='M3 4h26v24H3z'/%3E%3Cpath fill='%23000080' d='M4 5h24v5H4z'/%3E%3Cpath fill='%23fff' d='M4 11h24v16H4z'/%3E%3Cpath fill='%23008080' d='M7 14h7v9H7zm11 0h7v9h-7z'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./packages/shell/theme.css" />
    <link rel="stylesheet" href="./packages/productivity/styles.css" />
    <link rel="stylesheet" href="./packages/system/styles.css" />
    <link rel="stylesheet" href="./packages/games/styles.css" />
    <link rel="stylesheet" href="./packages/media/styles.css" />
  </head>
  <body>
    <main id="desktop" aria-label="Windows 3.1 desktop">
      <canvas id="desktop-canvas" aria-hidden="true"></canvas>
      <div id="boot" role="status">
        <div class="boot-window">
          <strong>Microsoft Windows</strong><span>Version 3.1</span>
          <div class="boot-rule"></div>
          <small>Starting Windows…</small>
        </div>
      </div>
    </main>
    <noscript>Windows 3.1 requires JavaScript to run.</noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
